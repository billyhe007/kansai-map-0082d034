function legTxt(l){if(l.mode==='train')return '电车（直线示意，非实际轨道）';if(!l.ok)return MODE[l.mode].n+' · 路线计算失败，仅画直线';return MODE[l.mode].n+' '+l.km.toFixed(2)+' km · 约 '+l.min+' 分钟'}
function draw(ids){
